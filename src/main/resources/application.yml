server:
  port: 8080

spring:
  profiles:
    active: local
  # Spring Boot 4 默认 Jackson 3；项目 DTO/脱敏序列化器仍使用 Jackson 2
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: ops-agent-core
  mvc:
    async:
      request-timeout: 5m # SSE 长连接超时（默认 30s 太短，5 分钟足够）

  servlet:
    multipart:
      # 与 ops-agent.knowledge.upload.max-size-mb 保持单一配置源；request 略大于 file 以容纳表单字段
      max-file-size: ${ops-agent.knowledge.upload.max-size-mb:50}MB
      max-request-size: ${ops-agent.knowledge.upload.max-request-mb:55}MB

  mail:
    # 邮件通知渠道的 SMTP 配置（T09/T11），通过环境变量注入
    host: "${SMTP_HOST:}"
    port: "${SMTP_PORT:465}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

  datasource:
    url: jdbc:postgresql://localhost:5433/opsdb
    username: postgres
    password: ${DB_PASSWORD:}     # ← 建议也改成环境变量
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
        temperature: 0.7
        timeout: 60s # LLM 调用超时（第三方容错）
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY:}
        model: text-embedding-v3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.opsagentcore.registry.entity


ops-agent:
  # 检索方式 type：in-memory / postgres / elasticsearch
  retrieval:
    keyword:
      type: in-memory
    rerank:
      enabled: false
      model: gte-rerank-v2 # 重排模型 采用阿里百炼rerank
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 7200
      issuer: ops-agent

  # 跨域来源白名单（逗号分隔）
  cors:
    allowed-origins: "${OPS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}"

  # 知识库
  knowledge:
    upload:
      # 上传文件大小上限（multipart max-file-size 引用同一配置，勿单独修改）
      max-size-mb: 50
      # multipart max-request-size，需略大于 max-size-mb 以容纳表单字段
      max-request-mb: 55
    ingest:
      # 解析后文本字符上限（超出显式拒绝，避免 maxNumChunks 静默截断）
      max-chars: 10000000

  crypto:
    # 密钥从 application-local.yml 或环境变量注入，这里只给默认值占位
    aes-key: "${OPS_AES_KEY:}"
    # 密钥版本（未来轮换用）
    key-version: "v1"
    # 存量数据迁移开关
    migrate-on-startup: false
  # 限流方案 bucket4j / redis / sentinel
  rate-limit:
    enabled: true
    type: bucket4j
    # 限流桶缓存：多久不访问后自动淘汰
    bucket-expire-minutes: 10
    # 限流桶缓存：最多缓存多少个用户/IP（超出按 LRU 淘汰）
    bucket-max-size: 10000
  audit:
    # 是否启用审计日志定时清理
    cleanup-enabled: true
    # 日志保留天数（超过该天数的将被删除）
    retention-days: 30
    # 每批删除条数（避免一次性锁表太久）
    batch-size: 1000
    # 每批之间的休眠毫秒数（给数据库喘息）
    batch-sleep-millis: 200
    # 每天几点执行（cron 表达式，默认凌晨 3 点）
    cron: "0 0 3 * * ?"

  # 第三方调用容错（超时 / 重试 / 熔断）
  resilience:
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
    retry-max-attempts: 2
    retry-wait-ms: 1000
    cb-failure-rate-threshold: 50
    cb-sliding-window-size: 10
    cb-wait-duration-sec: 30

  # 指标采样持久化
  metrics:
    # 采样数据保留天数
    retention-days: 7
    # 清理任务执行时间（每天凌晨 2:30）
    cleanup-cron: "0 30 2 * * ?"

  # 告警引擎
  alert:
    # 告警评估轮询 cron（默认每 30 秒）
    evaluate-cron: "*/30 * * * * ?"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    # 未配置 SMTP 环境变量时，禁用邮件健康检查，避免启动时尝试连接报错
    mail:
      enabled: false