server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: ops-agent-core
  datasource:
    url: jdbc:postgresql://localhost:5433/opsdb
    username: postgres
    password: hmj5201314.
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY:}
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true       # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl   # 用 SLF4J 输出 SQL
    global-config:
      db-config:
        table-underline: true                  # 表名默认下划线
    mapper-locations: classpath*:mapper/*.xml   # XML 位置（暂时没用到，但配好）
    type-aliases-package: com.example.opsagentcore.entity