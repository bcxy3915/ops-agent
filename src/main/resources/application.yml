server:
  port: 8080

spring:
  profiles:
    active: local
  # Spring Boot 4 默认 Jackson 3；项目 DTO/脱敏序列化器仍使用 Jackson 2
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: ops-agent-core
  mvc:
    async:
      request-timeout: 5m # SSE 长连接超时（默认 30s 太短，5 分钟足够）

  servlet:
    multipart:
      # 与 ops-agent.knowledge.upload.max-size-mb 保持单一配置源；request 略大于 file 以容纳表单字段
      max-file-size: ${ops-agent.knowledge.upload.max-size-mb:50}MB
      max-request-size: ${ops-agent.knowledge.upload.max-request-mb:55}MB

  mail:
    # 邮件通知渠道的 SMTP 配置（T09/T11），通过环境变量注入
    host: "${SMTP_HOST:}"
    port: "${SMTP_PORT:465}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

  datasource:
    url: jdbc:postgresql://localhost:5433/opsdb
    username: postgres
    password: ${DB_PASSWORD:}     # ← 建议也改成环境变量
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
        temperature: 0.7
        timeout: 60s # LLM 调用超时（第三方容错）
      embedding:
        # OpenAI SDK 会在 base-url 后追加 /embeddings，百炼兼容模式必须带 /v1，否则 404
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model: text-embedding-v3
    vectorstore:
      pgvector:
        # 迁移兼容配置：JDBC 存储读取维度与距离配置，不再自动建表或索引
        dimensions: 1024
        distance-type: COSINE_DISTANCE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.opsagentcore.registry.entity


ops-agent:
  # 模型适配器：spring-ai 为默认值，迁移验证时可切换为 langchain4j
  ai:
    provider: ${OPS_AI_PROVIDER:spring-ai}
    base-url: ${OPS_AI_BASE_URL:${spring.ai.openai.base-url:https://api.openai.com/v1}}
    api-key: ${OPS_AI_API_KEY:${AI_API_KEY:}}
    model: ${OPS_AI_MODEL:${spring.ai.openai.chat.options.model:deepseek-chat}}
    timeout: ${OPS_AI_TIMEOUT:60s}
    temperature: ${OPS_AI_TEMPERATURE:0.7}
    # 知识向量模型固定使用 LangChain4j，与聊天 provider 无关；保持存量模型与维度一致
    embedding:
      base-url: ${OPS_EMBEDDING_BASE_URL:${spring.ai.openai.embedding.base-url:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${OPS_EMBEDDING_API_KEY:${spring.ai.openai.embedding.api-key:}}
      model: ${OPS_EMBEDDING_MODEL:${spring.ai.openai.embedding.model:text-embedding-v3}}
      dimensions: ${OPS_EMBEDDING_DIMENSIONS:${spring.ai.vectorstore.pgvector.dimensions:1024}}
      timeout: ${OPS_EMBEDDING_TIMEOUT:60s}
      max-retries: ${OPS_EMBEDDING_MAX_RETRIES:2}
  # 检索方式 type：in-memory / postgres / elasticsearch
  retrieval:
    keyword:
      type: in-memory
    rerank:
      enabled: false
      model: gte-rerank-v2 # 重排模型 采用阿里百炼rerank
    # 同文档竞争治理（设计文档 §10.3.10）：top-K 内单文档配额 + 邻近块合并，
    # 防止同主题文档霸占 top-K 挤出期望文档；回退 = enabled: false
    diversity:
      enabled: true
      max-per-doc: 3
      merge-adjacent: true
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 7200
      issuer: ops-agent

  # 跨域来源白名单（逗号分隔）
  cors:
    allowed-origins: "${OPS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}"

  # 知识库
  knowledge:
    upload:
      # 上传文件大小上限（multipart max-file-size 引用同一配置，勿单独修改）
      max-size-mb: 50
      # multipart max-request-size，需略大于 max-size-mb 以容纳表单字段
      max-request-mb: 55
    ingest:
      # 解析后文本字符上限（超出显式拒绝，避免 maxNumChunks 静默截断）
      max-chars: 10000000
    # 文本切分策略（A/B 评测终局结论见 docs/design/text-split/文本切分策略-技术设计与评估-20261031.md §10.3.9）
    split:
      # 未命中类型路由时的默认策略（recursive / token）
      default-strategy: recursive
      # 目标块 token 预算（CL100K 近似，text-embedding-v3 实际分词略有偏差）
      chunk-size-tokens: 480
      # 相邻块重叠 token 数（约 17%，落在句边界）
      overlap-tokens: 80
      # 尾块最小字符数，不足并入前块
      min-chunk-chars: 100
      # 单块 token 硬上限
      max-chunk-tokens: 800
      # embedding 文本携带「标题｜章节」上下文头（展示文本不受影响）
      keep-heading-path: true
      # 围栏代码块与表格作为原子单元不被切断
      preserve-code-block: true
      markdown:
        # MARKDOWN 类型策略覆盖（markdown-structural / recursive / token）
        strategy: markdown-structural
        # headingPath 最深采集层级
        max-heading-level: 3
    # 异步索引任务：审核/确认只写任务，分块与向量化由后台 worker 在独立事务中执行
    index:
      # 调度轮询间隔（毫秒）
      poll-interval-ms: 5000
      # 每轮最多处理任务数
      max-per-round: 3
      # 任务租约时长（分钟），需覆盖大文档完整索引耗时，过短会导致多实例重复执行
      lease-minutes: 30

  crypto:
    # 密钥从 application-local.yml 或环境变量注入，这里只给默认值占位
    aes-key: "${OPS_AES_KEY:}"
    # 密钥版本（未来轮换用）
    key-version: "v1"
    # 存量数据迁移开关
    migrate-on-startup: false
  # 限流方案 bucket4j / redis / sentinel
  rate-limit:
    enabled: true
    type: bucket4j
    # 限流桶缓存：多久不访问后自动淘汰
    bucket-expire-minutes: 10
    # 限流桶缓存：最多缓存多少个用户/IP（超出按 LRU 淘汰）
    bucket-max-size: 10000
  audit:
    # 是否启用审计日志定时清理
    cleanup-enabled: true
    # 日志保留天数（超过该天数的将被删除）
    retention-days: 30
    # 每批删除条数（避免一次性锁表太久）
    batch-size: 1000
    # 每批之间的休眠毫秒数（给数据库喘息）
    batch-sleep-millis: 200
    # 每天几点执行（cron 表达式，默认凌晨 3 点）
    cron: "0 0 3 * * ?"

  # 第三方调用容错（超时 / 重试 / 熔断）
  resilience:
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
    retry-max-attempts: 2
    retry-wait-ms: 1000
    cb-failure-rate-threshold: 50
    cb-sliding-window-size: 10
    cb-wait-duration-sec: 30

  # 指标采样持久化
  metrics:
    # 采样数据保留天数
    retention-days: 7
    # 清理任务执行时间（每天凌晨 2:30）
    cleanup-cron: "0 30 2 * * ?"

  # 告警引擎
  alert:
    # 告警评估轮询 cron（默认每 30 秒）
    evaluate-cron: "*/30 * * * * ?"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    # 未配置 SMTP 环境变量时，禁用邮件健康检查，避免启动时尝试连接报错
    mail:
      enabled: false

# 日志级别：默认 INFO，可通过环境变量 LOG_LEVEL 统一调整
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    # 业务包与第三方客户端保持同一默认级别，便于按包单独调试（如 DEBUG）
    com.example.opsaiagent: ${LOG_LEVEL:INFO}
