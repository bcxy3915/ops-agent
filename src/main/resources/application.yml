server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: ops-agent-core
  mvc:
    async:
      request-timeout: 5m # SSE 长连接超时（默认 30s 太短，5 分钟足够）

  datasource:
    url: jdbc:postgresql://localhost:5433/opsdb
    username: postgres
    password: ${DB_PASSWORD:}     # ← 建议也改成环境变量
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY:}
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.opsagentcore.registry.entity