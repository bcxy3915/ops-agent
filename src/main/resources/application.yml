server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: ops-agent-core
  mvc:
    async:
      request-timeout: 5m # SSE 长连接超时（默认 30s 太短，5 分钟足够）

  datasource:
    url: jdbc:postgresql://localhost:5433/opsdb
    username: postgres
    password: ${DB_PASSWORD:}     # ← 建议也改成环境变量
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY:}
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.opsagentcore.registry.entity


ops-agent:
  # 检索方式 type：in-memory / postgres / elasticsearch
  retrieval:
    keyword:
      type: in-memory
    rerank:
      enabled: false
      model: gte-rerank-v2 # 重排模型 采用阿里百炼rerank
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 7200
      issuer: ops-agent
  # 限流方案 bucket4j / redis / sentinel
  rate-limit:
    enabled: true
    type: bucket4j
    # 限流桶缓存：多久不访问后自动淘汰
    bucket-expire-minutes: 10
    # 限流桶缓存：最多缓存多少个用户/IP（超出按 LRU 淘汰）
    bucket-max-size: 10000
  audit:
    # 是否启用审计日志定时清理
    cleanup-enabled: true
    # 日志保留天数（超过该天数的将被删除）
    retention-days: 30
    # 每批删除条数（避免一次性锁表太久）
    batch-size: 1000
    # 每批之间的休眠毫秒数（给数据库喘息）
    batch-sleep-millis: 200
    # 每天几点执行（cron 表达式，默认凌晨 3 点）
    cron: "0 0 3 * * ?"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always